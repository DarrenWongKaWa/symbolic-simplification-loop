[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-simplification-loop"
version = "0.1.0"
description = "Loop Engineering infrastructure for benchmark-driven symbolic simplification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "jsonschema>=4",
  "PyYAML>=6",
  "rich>=13",
  "watchdog>=4"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
schemas = ["*.schema.json"]
