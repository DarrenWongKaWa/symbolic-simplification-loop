profile: sigma_abc_pair_basis_refinement
autonomy:
  allow_physics_simplification: false
  allow_kernel_fusion: false
  allow_ibp_reduction: false
  max_stages_per_run: 1
  stop_after_stage: sigma_abc_009_pair_sector_basis_refinement_classification
allowed_stage_ids:
  - sigma_abc_009_pair_sector_basis_refinement_classification
allowed_stage_tags:
  - pair_basis_refinement
  - no_kernel_fusion
  - no_ibp
review:
  mode: codex_subagent
  scope: routine_branch
reporting:
  build_stage_digest: true
  require_human_readable_review: true
  require_meta_review: true
patch_limits:
  max_patch_attempts_per_stage: 1
hard_stop_policy: sigma_abc_hard_stops
benchmark_policy: sigma_xxx_projection
agents:
  require_real_invocation: true
  forbid_stub_in_production: true
  require_invocation_evidence: true
  require_read_only_contract: true
  require_mailbox_events: true
  allow_stub_for_tests: false
orchestration:
  use_mailbox: true
  require_patch_planner_for_patch: true
  max_patch_attempts_per_stage: 2
patching:
  max_patch_attempts_per_stage: 2
  allow_report_only_patch: true
  allow_validation_patch: true
  allow_symbolic_patch: true
  require_patch_plan: true
hypothesis_search:
  enabled: false
  max_conjectures_per_stage: 6
  max_candidates_per_conjecture: 2
  max_total_candidate_attempts: 10
  archive_failed_conjectures: true
  allow_ibp_conjectures: false
  allow_total_derivative_conjectures: false
  promote_only_verified_candidates: true
  require_candidate_ranking: true
